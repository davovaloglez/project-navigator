name: CI
on:
  pull_request:
  push:
    branches: [develop, master]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test --if-present
      - run: npm run build
        env:
          NODE_ENV: production
